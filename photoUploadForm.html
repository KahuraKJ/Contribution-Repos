<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Member Photo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Upload Member Photo 🖼️</h2>
        <p class="text-sm text-gray-600 mb-6 text-center">Please provide your ID number and a clear photo for your ID card.</p>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="mb-4">
                <label for="id_no" class="block text-gray-700 font-semibold mb-2">Member ID No</label>
                <input type="text" id="id_no" name="id_no" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
            </div>
            <div class="mb-6">
                <label for="member_photo" class="block text-gray-700 font-semibold mb-2">Choose Photo</label>
                <input type="file" id="member_photo" name="profile_photo" accept="image/jpeg, image/png, image/gif" class="w-full text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" required>
                <p class="text-xs text-gray-500 mt-2">Accepted formats: JPG, PNG, GIF (Max 5MB)</p>
            </div>
            <div class="text-center">
                <button type="submit" class="w-full px-6 py-3 bg-blue-600 text-white rounded-lg shadow-md hover:bg-blue-700 transition duration-300 transform hover:scale-105">
                    Upload Photo
                </button>
            </div>
            <div id="uploadStatus" class="mt-4 text-center text-sm font-semibold"></div>
        </form>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#uploadForm').on('submit', function(e) {
                e.preventDefault();
                
                var formData = new FormData(this);
                
                $.ajax({
                    url: 'photoUpload.php',
                    type: 'POST',
                    data: formData,
                    contentType: false,
                    processData: false,
                    dataType: 'json',
                    beforeSend: function() {
                        $('#uploadStatus').html('<p class="text-blue-500">Uploading photo... Please wait.</p>');
                    },
                    success: function(response) {
                        if (response.success) {
                            $('#uploadStatus').html('<p class="text-green-600">' + response.message + '</p>');
                            $('#uploadForm')[0].reset(); // Clear the form
                        } else {
                            $('#uploadStatus').html('<p class="text-red-600">' + response.message + '</p>');
                        }
                    },
                    error: function() {
                        $('#uploadStatus').html('<p class="text-red-600">An unexpected error occurred. Please try again.</p>');
                    }
                });
            });
        });
    </script>
</body>
</html>
