  <form class="form-wizard" id="registration-form">

    
    <!-- Registration Successful -->
    <div class="completed" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none"
           viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">

    <h1>Registration</h1>

    <!-- Progress bar -->
    <div class="progress-container">
      <div class="progress"></div>
      <ol>
        <li class="current">Personal</li>
        <li>Emergency</li>
        <li>Transport</li>
        <li>Residential</li>
        <!-- <li>Account</li> -->
        <li>Fee</li>
      </ol>
    </div>

    <!-- Steps -->
    <div class="steps-container">

      <!-- Step 1: Personal -->
      <div class="step">
        <h3><i class="fas fa-user"></i> Personal Information</h3>
        
        <div class="form-group">
          <input type="text" id="full-name" name="full_name" placeholder=" " required/>
          <label for="full_name">Full Name</label>
        </div>

        <div class="form-row">
          <div class="form-group">
            <input type="text" id="id_no" name="id_no" placeholder=" "  maxlength="8" pattern="\d{1,8}" required/>
            <label for="id_no2">ID NO.</label>
          </div>
          <div class="form-group">
            <input type="text" id="kra_pin" name="kra_pin" placeholder=" "  maxlength="10"/>
            <label for="kra_pin">KRA PIN</label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <input type="date" id="date_of_birth" name="date_of_birth" required/>
            <label for="date_of_birth">Date Of Birth</label>
          </div>
          <div class="form-group">
            <select id="education_level" name="education_level" required >
              <option value="" disabled selected>Select Level of Education</option>
              <option>None</option><option>Primary</option><option>Secondary</option>
              <option>Certificate</option><option>Diploma</option><option>Degree</option>
              <option>Masters</option><option>PhD</option><option>Undergraduate</option>
              <option>Postgraduate</option><option>Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <select id="gender" name="gender" required onchange="handleGenderChange();">
              <option value="" disabled selected>Select Gender</option>
              <option value="male">Male</option><option value="female">Female</option>
            </select>
          </div>
          <div class="form-group">
            <select id="marital_status" name="marital_status" required >
              <option value="" disabled selected>Select Marital Status</option>
              <option>Single</option><option>Married</option>
              <option>Divorced</option><option>Widowed</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
          <input type="tel" id="whatsapp-number" name="contact_number" placeholder=" " pattern="0[17][0-9]{8}" required/>
          <label for="contact_number">Contact Number (Official)</label>
        </div>
        <div class="form-group">
          <input type="email" id="email_address" name="email_address" placeholder=" " required/>
          <label for="email_address">Email Address</label>
        </div>
        </div>
        <div class="form-group" id="Whatsapp_number_group" >  
            <input type="tel" class="form-control" id="whatsapp_number_group" name="whatsapp_number_group" placeholder="" >
            <label for="whatsapp_number_group">WhatsApp Number</label>
          </div>
      </div>

      <!-- Step 2: Contact & Address -->

        <h3><i class="fas fa-route"></i>Emergency Information</h3>
        <div class="form-group">
            <input type="text" id="next_kin" name="next_kin" placeholder=" " required />
            <label for="next_kin">Next Of Kin</label>
          </div>

            <div class="form-group">
            <select id="relationship" name="relationship" required>

              <option>Child</option><option>Relative</option>

            </select>
          </div>
          <div class="form-row">
          <div class="form-group">
          <input type="tel" id="next_kin_phone" name="next_kin_phone" pattern="^0[17][0-9]{8}$" maxlength="10" inputmode="numeric" placeholder=" " required />

        </div>
        <div class="form-group">

        </div>
        <div class="form-group">

        </div>
        <div class="form-group">

        </div>
        </div>

        document.addEventListener('DOMContentLoaded', function () {
            const countySelect = document.getElementById('countySelect');
            const subCountySelect = document.getElementById('subCountySelect');
            const ward = document.getElementById('ward');

            function populateCounties() {
                for (const county in countyData) {
                    const option = document.createElement('option');
                    option.value = county;
                    option.textContent = county;
                    countySelect.appendChild(option);
                }
            }

            function populateSubCounties(selectedCounty) {
                subCountySelect.innerHTML = '<option value="" disabled selected>-- Select Your Sub-County --</option>';
                ward.innerHTML = '<option value="" disabled selected>-- Select Your Ward --</option>';
                ward.disabled = true;

                if (selectedCounty && countyData[selectedCounty]) {
                    const subCounties = Object.keys(countyData[selectedCounty]);
                    subCounties.forEach(sub => {
                        const option = document.createElement('option');
                        option.value = sub;
                        option.textContent = sub;
                        subCountySelect.appendChild(option);
                    });
                    subCountySelect.disabled = false;
                } else {
                    subCountySelect.disabled = true;
                }
            }

            function populateEstates(selectedCounty, selectedSubCounty) {
                ward.innerHTML = '<option value="" disabled selected>-- Select Your Ward --</option>';

                if (
                    selectedCounty &&
                    selectedSubCounty &&
                    countyData[selectedCounty] &&
                    countyData[selectedCounty][selectedSubCounty]
                ) {
                    countyData[selectedCounty][selectedSubCounty].forEach(estate => {
                        const option = document.createElement('option');
                        option.value = estate;
                        option.textContent = estate;
                        ward.appendChild(option);
                    });
                    ward.disabled = false;
                } else {
                ward.disabled = true;
                }
            }

            countySelect.addEventListener('change', function () {
                const selectedCounty = this.value;
                populateSubCounties(selectedCounty);
            });

            subCountySelect.addEventListener('change', function () {
                const selectedCounty = countySelect.value;
                const selectedSubCounty = this.value;
                populateEstates(selectedCounty, selectedSubCounty);
            });

            populateCounties();
        });
    </script>
